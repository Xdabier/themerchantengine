# Engine stack, rendered by the install stepper (plan E4.4). Do not edit the
# rendered copy by hand: run setup again and it is rewritten.
#
#   docker compose -f deploy/engine/docker-compose.yml --env-file {{ENV_FILE}} up -d
#
# Services:
#   postgres   internal      Postgres 16, the app database
#   redis      internal      Redis 7, BullMQ and cache
#   api        internal      NestJS API, built from apps/api/Dockerfile
#   admin      internal      nginx serving the Angular admin, built from apps/admin/Dockerfile
#   nginx      0.0.0.0:80,443  Edge reverse proxy; terminates TLS for {{ADMIN_HOST}} and {{API_HOST}}
#   certbot    on demand     Issues and renews the Let's Encrypt certificates (webroot)

name: {{PROJECT_NAME}}

services:
  postgres:
    image: postgres:16
    container_name: {{PROJECT_NAME}}-postgres
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: merchants_engine
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d merchants_engine"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: {{PROJECT_NAME}}-redis
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: {{PROJECT_NAME}}/api:{{IMAGE_TAG}}
    container_name: {{PROJECT_NAME}}-api
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    env_file:
      - {{ENV_FILE}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # The license, the invoice logo and the optional Search Console key,
      # copied here by the stepper. Read-only: the API never writes them.
      - ./config:/app/config:ro

  admin:
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
    image: {{PROJECT_NAME}}/admin:{{IMAGE_TAG}}
    container_name: {{PROJECT_NAME}}-admin
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  nginx:
    image: nginx:1.27-alpine
    container_name: {{PROJECT_NAME}}-edge
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on:
      - api
      - admin
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ../shared/nginx-base.conf:/etc/nginx/conf.d/00-base.conf:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:v3.3.0
    container_name: {{PROJECT_NAME}}-certbot
    profiles: ["tools"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt

volumes:
  pg-data:
  redis-data:
  certbot-webroot:
  certbot-certs:
