# Port 80 for every host this box serves, rendered by the install stepper.
# The ACME challenge is answered from the certbot webroot; everything else
# is sent to https. This file is the first the edge loads, so it holds the
# default_server for port 80 and is present before any certificate exists,
# which is what lets certbot's webroot challenge succeed on a fresh box.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name {{HOSTS}};

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
