# Local profile edge, rendered by the install stepper: the admin on port
# 53200 over plain http, with /api proxied to the API container. Same shape
# as the TLS admin vhost, minus the certificate, so a local install exercises
# the proxied layout a server install runs.

map $http_x_request_id $request_id_out {
    "~^[A-Za-z0-9._-]{1,64}$" $http_x_request_id;
    default                   $request_id;
}

server {
    listen 53200 default_server;
    server_name _;

    # No security header is added here: the admin container emits its own
    # set on the document and the API emits its own on the proxied /api. A
    # second copy at the edge arrives joined with a comma and reads as a
    # wrong value to the installer's probe and to any strict client.

    resolver 127.0.0.11 valid=10s;
    set $admin http://admin:80;
    set $api http://api:53000;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Request-Id $request_id_out;
        client_max_body_size 12m;
    }

    location / {
        proxy_pass $admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
