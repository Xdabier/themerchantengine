# {{HOST}}: the admin, rendered by the install stepper once its certificate
# exists. The admin build carries a relative API base, so /api on this host
# is proxied to the API container; the browser never leaves this origin.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name {{HOST}};

    ssl_certificate     /etc/letsencrypt/live/{{HOST}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{HOST}}/privkey.pem;

    # Every security header has one emitter: the admin container for the
    # document, the API for the proxied /api, because a header added at the
    # edge as well arrives twice joined with a comma, and the installer's
    # probe (and any strict client) reads that as a wrong value. HSTS is the
    # one the edge adds, inside `location /` only: the admin container is a
    # static nginx that emits none, and the API emits its own.

    resolver 127.0.0.11 valid=10s;
    set $admin http://admin:80;
    set $api http://api:53000;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id_out;
        proxy_read_timeout 60s;
        client_max_body_size 12m;
    }

    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        proxy_pass $admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
