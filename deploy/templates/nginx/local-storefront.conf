# Local profile edge, rendered by the install stepper: the storefront on port
# 53300 over plain http, with /v1 proxied to the API container as /api/v1.
# Same shape as the TLS storefront vhost, minus the certificate, so a local
# install exercises the proxied layout a server install runs. The request-id
# map lives in the admin vhost of the same edge.

server {
    listen 53300;
    server_name _;

    # No security header is added here: the storefront's own middleware
    # emits the set, and a second copy at the edge arrives joined with a
    # comma.

    resolver 127.0.0.11 valid=10s;
    set $storefront http://storefront:54300;

    # The browser-side API client uses a relative base; see storefront.conf
    # for why the prefix is rewritten and the proxy_pass carries the origin
    # alone.
    location /v1/ {
        set $api_v1 http://api:53000;
        rewrite ^/v1/(.*)$ /api/v1/$1 break;
        proxy_pass $api_v1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id_out;
        proxy_set_header Connection "";
        client_max_body_size 12m;
    }

    location / {
        proxy_pass $storefront;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Request-Id $request_id_out;
        proxy_read_timeout 60s;
    }
}
