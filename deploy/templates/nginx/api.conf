# {{HOST}}: the API, rendered by the install stepper once its certificate exists.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name {{HOST}};

    ssl_certificate     /etc/letsencrypt/live/{{HOST}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{HOST}}/privkey.pem;

    # No security header is added here: the API emits its own set, HSTS
    # included, and a second copy at the edge arrives joined with a comma.

    # Docker's embedded DNS, so the upstream is re-resolved after a container
    # is recreated instead of pinned to the address it had at nginx start.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:53000;

    location / {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id_out;
        proxy_read_timeout 60s;
        client_max_body_size 12m;
    }
}
