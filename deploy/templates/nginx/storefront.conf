# {{HOST}}: the storefront, rendered by the install stepper once its
# certificate exists. The www host, when the store has one, is a redirect to
# the apex so canonicals hold.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name {{HOST}};

    ssl_certificate     /etc/letsencrypt/live/{{HOST}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{HOST}}/privkey.pem;

    # No security header is added here, HSTS included: the storefront's own
    # middleware (apps/storefront/src/server/middleware/security-headers.ts)
    # emits the set, and a second copy at the edge arrives joined with a
    # comma, which a strict client reads as a wrong value.

    resolver 127.0.0.11 valid=10s;
    set $storefront http://storefront:54300;

    # The IndexNow key file, when one was entered, served from the overlay the
    # stepper writes. The pattern is the IndexNow spec's: 8 to 128 hex chars.
    location ~ "^/[a-f0-9]{8,128}\.txt$" {
        root /etc/nginx/indexnow;
        default_type "text/plain";
        try_files $uri =404;
    }

    # The browser-side API client uses a relative base, so every call it
    # makes lands on this origin as /v1/...; the edge carries it to the API
    # as /api/v1/... (the API runs under API_GLOBAL_PREFIX=api). The upstream
    # is a variable so it is resolved per request through the resolver, never
    # at parse time, which lets the edge start before the API container and
    # lets CI parse the file; and because a variable proxy_pass with a URI
    # part REPLACES the request URI instead of appending it (that collapsed
    # every /v1/* to /api/v1/ once), the prefix is rewritten first and the
    # proxy_pass carries the origin alone. The upstream is the API container
    # on a one-box install and the engine's public origin on a storefront-only
    # box; the SSL directives are inert on an http upstream.
    location /v1/ {
        set $api_v1 {{API_UPSTREAM}};
        rewrite ^/v1/(.*)$ /api/v1/$1 break;
        proxy_pass $api_v1;
        proxy_http_version 1.1;
        proxy_set_header Host {{API_HOST}};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-Id $request_id_out;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_ssl_name {{API_HOST}};
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        client_max_body_size 12m;
    }

    location / {
        proxy_pass $storefront;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id_out;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.{{HOST}};

    ssl_certificate     /etc/letsencrypt/live/{{HOST}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{HOST}}/privkey.pem;

    # No application answers here, so the storefront middleware cannot emit
    # HSTS for this host; the same value it emits for the apex, so the preload
    # claim covers every host the certificate does.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    return 301 https://{{HOST}}$request_uri;
}
