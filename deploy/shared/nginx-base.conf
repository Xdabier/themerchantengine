# Shared TLS + security defaults loaded into the edge nginx container of every
# server profile via /etc/nginx/conf.d/00-base.conf. Mounted from
# deploy/shared/nginx-base.conf by the rendered compose files so the engine
# and storefront stacks stay in sync.

# Modern TLS only.
ssl_protocols              TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers  on;
ssl_ciphers                'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
ssl_session_cache          shared:SSL:10m;
ssl_session_timeout        1d;
ssl_session_tickets        off;

# OCSP stapling is intentionally absent. Let's Encrypt stopped publishing an
# OCSP responder URL in its certificates, so `ssl_stapling on` became a no-op
# that logged `"ssl_stapling" ignored, no OCSP responder URL` on every reload.
# Revocation is carried by CRL / short 90-day lifetimes instead.
#
# The resolver stays: the rendered vhosts override it with Docker's embedded
# DNS at 127.0.0.11 for compose service names. Never merge the two into one
# directive: a second `resolver` at http context is a duplicate-directive
# emerg and the edge container will not start.
resolver                   1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout           5s;

# Hide version banner
server_tokens              off;

# One request id end to end: the client's X-Request-Id when it sent one, the
# id nginx minted otherwise. The vhosts forward $request_id_out and the
# access log records $http_x_request_id; this map keeps the two the same.
map $http_x_request_id $request_id_out {
    "~^[A-Za-z0-9._-]{1,64}$" $http_x_request_id;
    default                   $request_id;
}

# Compression
gzip                       on;
gzip_types                 text/plain text/css application/javascript application/json image/svg+xml application/xml application/rss+xml;
gzip_min_length            1024;
gzip_vary                  on;

# Hard request body cap at the edge (the API also enforces 100 KB on JSON).
# Keep generous to allow image uploads from the admin (max 10 MB per env).
client_max_body_size       12m;

# Logging — JSON-ish so it pipes cleanly into journald + log aggregator.
log_format json_combined escape=json
  '{ "time":"$time_iso8601", "remote":"$remote_addr", "req_id":"$http_x_request_id", '
  '"method":"$request_method", "host":"$host", "uri":"$request_uri", '
  '"status":$status, "bytes":$body_bytes_sent, "rt":$request_time, '
  '"ua":"$http_user_agent", "ref":"$http_referer", "fwd":"$http_x_forwarded_for" }';
access_log /var/log/nginx/access.log json_combined buffer=32k flush=5s;
error_log  /var/log/nginx/error.log  warn;
