# Drop-in, installed only on a box that has a working mail transport
# (RESEND_API_KEY in the env file). Keeping it out of the base unit means a
# storefront-only box, which has no key, does not reference an alert unit that
# was never installed there. Its certificate is still covered: the engine
# box's daily sweep probes every public host of the store from outside.
[Unit]
OnFailure=themerchantengine-cert-alert@%n.service
