<!doctype html>
<html lang="fr" class="h-full" data-tme-app="admin">
  <head>
    <meta charset="utf-8" />
    <title>merchants-engine · admin</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Names the engine to technology detectors (DR-36). -->
    <meta name="generator" content="themerchantengine" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="color-scheme" content="dark light" />
    <!--
      Sets the colour mode before the first paint, so no render starts in the
      mode the operator did not ask for. Angular's ThemeStore owns the same
      key and the same three values the moment it boots; this runs in the gap
      before it exists.

      Deliberately one line. `apps/admin/nginx.conf` allows it through a
      CSP hash of this exact text, and a newline inside it would be one more
      byte that differs between a CRLF checkout and an LF one, so the hash
      would hold on one machine and fail on the other.
      `apps/admin/src/theme-boot.spec.ts` recomputes the hash from this file
      and fails when the two disagree.

      The two hexes are the second and third documented out-of-CSS colour
      literals, alongside the `theme-color` default above, for the same
      reason: `<meta>` content is platform metadata and cannot read a CSS
      variable. They are pinned to `--color-void-black` and
      `--color-paper-white`.
    -->
    <script>var m='dark';try{var s=localStorage.getItem('admin-theme');m=(s==='dark'||s==='light')?s:(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');}catch(e){}document.documentElement.setAttribute('data-theme',m);var t=document.querySelector('meta[name="theme-color"]');if(t)t.setAttribute('content',m==='light'?'#E8E4DF':'#0A0A0A');</script>
    <!-- The Merchant Engine brand mark: orange square. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23ff3b00'/%3E%3C/svg%3E"
    />
    <!--
      Satoshi is loaded via styles.css @import so beasties can inline it at build
      time (and, if the Fontshare CDN is slow, it doesn't block DOMContentLoaded).
      Self-hosted WOFF2 migration is tracked for a later phase.
    -->
  </head>
  <body class="h-full bg-surface text-ink font-sans antialiased">
    <app-root></app-root>
  </body>
</html>
