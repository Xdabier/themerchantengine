# The admin's security headers, included at the server level AND inside every
# location that declares an add_header of its own.
#
# nginx inherits add_header from the enclosing level only when the current
# level declares none; a location that sets Cache-Control silently drops the
# whole server-level set. That is how the admin once shipped with no
# X-Frame-Options and no CSP on the document itself. One file, included
# wherever an add_header appears, so the set cannot be lost again.
add_header X-Frame-Options                "DENY"                              always;
add_header X-Content-Type-Options         "nosniff"                           always;
add_header Referrer-Policy                "strict-origin-when-cross-origin"   always;
add_header Permissions-Policy             "camera=(), microphone=(), geolocation=()" always;
# The one inline script is the colour-mode boot in `index.html`, allowed by
# the hash of its exact text rather than by 'unsafe-inline'. Editing that
# script without editing this hash fails `apps/admin/src/theme-boot.spec.ts`.
#
# `connect-src 'self'` covers the proxied install, where the admin and the
# engine answer on one origin. A split-origin deployment adds the API
# origin here at install time, alongside the matching `apiBaseUrl` in
# `apps/admin/src/environments/environment.prod.ts`. The engine ships no
# deployment's domain in either place.
add_header Content-Security-Policy        "default-src 'self'; script-src 'self' 'sha256-0jZtBDRUKyl40SajunZMOa6XHtHLV8MVQmGmCG6wJKo='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self';" always;
