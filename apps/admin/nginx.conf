# Admin SPA — served from inside the admin container by nginx:alpine.
# Edge nginx (in the engine docker-compose) terminates TLS and reverse-proxies
# to this container on port 80. CSP + security headers are layered at the edge
# AND here so the container is safe in isolation.
#
# The headers live in security-headers.conf and are included at the server
# level and again inside every location that declares an add_header of its
# own, because nginx drops the inherited set the moment a level declares one.

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 65;
  gzip            on;
  gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  server_tokens off;

  server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # Hashed asset files — cache forever
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|webp|ico)$ {
      include /etc/nginx/security-headers.conf;
      expires 1y;
      add_header Cache-Control "public, immutable" always;
      try_files $uri =404;
    }

    # SPA fallback — every unmatched path serves index.html
    location / {
      include /etc/nginx/security-headers.conf;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /healthz {
      include /etc/nginx/security-headers.conf;
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }
  }
}
